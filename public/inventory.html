<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MTG Inventory</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; 
            background: #0a0a0f;
            color: #e8e8ed;
            height: 100dvh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            -webkit-font-smoothing: antialiased;
        }
        :root {
            --bg-primary: #0a0a0f;
            --bg-surface: rgba(18,18,26,0.85);
            --bg-elevated: rgba(26,26,40,0.7);
            --bg-hover: rgba(34,34,58,0.6);
            --border: rgba(255,255,255,0.06);
            --border-hover: rgba(255,255,255,0.12);
            --text-primary: #e8e8ed;
            --text-secondary: #9e9eaf;
            --text-muted: #6a6a7e;
            --accent-start: #8b5cf6;
            --accent-mid: #6366f1;
            --accent-end: #06b6d4;
            --accent-gradient: linear-gradient(135deg, #8b5cf6, #6366f1, #06b6d4);
            --glass-bg: rgba(255,255,255,0.03);
            --glass-border: rgba(255,255,255,0.06);
            --glass-shadow: 0 8px 32px rgba(0,0,0,0.4);
            --green: #22c55e;
            --green-bg: rgba(34,197,94,0.08);
            --green-border: rgba(34,197,94,0.2);
            --red: #ef4444;
            --orange: #f59e0b;
            --blue: #3b82f6;
            --radius: 12px;
            --radius-sm: 8px;
            --radius-lg: 16px;
            --radius-xl: 20px;
        }
        .hidden { display: none !important; }

        .app-header { display: flex; align-items: center; gap: 8px; padding: 8px 12px; background: var(--bg-surface); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); border-bottom: 1px solid var(--border); flex-shrink: 0; z-index: 50; }
        .app-header .brand { font-size: 15px; font-weight: 700; background: var(--accent-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
        .app-header .spacer { flex: 1; min-width: 4px; }
        .hamburger-wrap { position: relative; flex-shrink: 0; }
        .hamburger-btn { width: 34px; height: 34px; border: none; border-radius: 8px; background: var(--glass-bg); border: 1px solid var(--glass-border); color: var(--text-secondary); font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.15s; font-family: inherit; }
        .hamburger-btn:hover { background: var(--bg-hover); color: var(--text-primary); border-color: var(--border-hover); }
        .hamburger-popup { position: absolute; top: calc(100% + 6px); left: 0; background: var(--bg-surface); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); border: 1px solid var(--border); border-radius: var(--radius); padding: 4px; min-width: 180px; box-shadow: 0 12px 48px rgba(0,0,0,0.5); z-index: 100; display: none; animation: fadeIn 0.12s ease-out; }
        .hamburger-popup.open { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: translateY(0); } }
        .ham-item { display: block; width: 100%; padding: 10px 14px; border: none; border-radius: 6px; background: transparent; color: var(--text-secondary); font-size: 13px; font-weight: 500; cursor: pointer; text-align: left; font-family: inherit; transition: all 0.1s; }
        .ham-item:hover { background: rgba(99,102,241,0.1); color: var(--text-primary); }
        .ham-item.active { background: rgba(99,102,241,0.15); color: #fff; font-weight: 600; }
        .ham-divider { height: 1px; background: var(--border); margin: 4px 8px; }

        .page-content { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; min-height: 0; }

        .tab-bar { display: flex; gap: 4px; padding: 4px; background: var(--bg-elevated); border-radius: var(--radius); border: 1px solid var(--border); flex-shrink: 0; }
        .tab-btn { padding: 8px 16px; border: none; border-radius: var(--radius-sm); background: transparent; color: var(--text-muted); font-size: 12px; font-weight: 600; cursor: pointer; font-family: inherit; transition: all 0.15s; flex: 1; text-align: center; }
        .tab-btn:hover { color: var(--text-secondary); background: var(--bg-hover); }
        .tab-btn.active { background: rgba(99,102,241,0.15); color: #fff; }

        .ui-card { background: var(--bg-surface); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; box-shadow: 0 4px 24px rgba(0,0,0,0.2); }
        .ui-card-title { font-size: 11px; font-weight: 600; color: var(--text-muted); margin-bottom: 12px; text-transform: uppercase; letter-spacing: 0.5px; }

        .btn { padding: 8px 16px; border: none; border-radius: var(--radius-sm); font-size: 12px; font-weight: 600; cursor: pointer; font-family: inherit; transition: all 0.15s; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
        .btn:active { transform: scale(0.97); }
        .btn:disabled { opacity: 0.4; pointer-events: none; }
        .btn-primary { background: var(--accent-gradient); color: #fff; box-shadow: 0 2px 12px rgba(99,102,241,0.3); }
        .btn-primary:hover { box-shadow: 0 4px 20px rgba(99,102,241,0.4); transform: translateY(-1px); }
        .btn-success { background: var(--green); color: #fff; }
        .btn-success:hover { filter: brightness(1.1); transform: translateY(-1px); }
        .btn-danger { background: var(--red); color: #fff; }
        .btn-ghost { background: var(--glass-bg); border: 1px solid var(--glass-border); color: var(--text-secondary); }
        .btn-ghost:hover { background: var(--bg-hover); border-color: var(--border-hover); }
        .btn-sm { padding: 5px 10px; font-size: 10px; }

        .filter-bar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
        .filter-bar input, .filter-bar select { padding: 8px 12px; border: 1px solid var(--border); border-radius: var(--radius-sm); font-size: 12px; font-family: inherit; background: var(--bg-elevated); color: var(--text-primary); outline: none; transition: all 0.2s; }
        .filter-bar input:focus, .filter-bar select:focus { border-color: var(--accent-mid); box-shadow: 0 0 0 3px rgba(99,102,241,0.15); }
        .filter-bar input::placeholder { color: var(--text-muted); }

        .search-wrap { position: relative; flex: 1; min-width: 200px; max-width: 400px; }
        .search-wrap input { width: 100%; padding: 8px 12px; padding-right: 32px; }
        .search-wrap .clear-btn { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 14px; padding: 2px; }

        .data-table-wrap { overflow-x: auto; margin: 0 -16px; padding: 0 16px; }
        .data-table { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 12px; }
        .data-table th { position: sticky; top: 0; background: var(--bg-elevated); backdrop-filter: blur(12px); padding: 8px 10px; text-align: left; font-weight: 600; color: var(--text-muted); font-size: 10px; text-transform: uppercase; letter-spacing: 0.3px; white-space: nowrap; cursor: pointer; user-select: none; border-bottom: 1px solid var(--border); }
        .data-table th:hover { color: var(--text-primary); }
        .data-table th .sort-arrow { display: inline-block; margin-left: 4px; opacity: 0.4; font-size: 9px; }
        .data-table th.sorted .sort-arrow { opacity: 1; color: var(--accent-mid); }
        .data-table td { padding: 8px 10px; border-bottom: 1px solid var(--border); color: var(--text-secondary); white-space: nowrap; }
        .data-table tr:hover td { background: var(--bg-hover); }
        .data-table td .card-img { width: 40px; height: 56px; border-radius: 4px; object-fit: cover; cursor: pointer; transition: transform 0.15s; display: block; }
        .data-table td .card-img:hover { transform: scale(2.5); z-index: 10; position: relative; box-shadow: 0 4px 16px rgba(0,0,0,0.5); }
        .data-table .editable { cursor: pointer; border-bottom: 1px dashed var(--border-hover); }
        .data-table .editable:hover { color: var(--text-primary); }
        .data-table .edit-input { padding: 4px 6px; border: 1px solid var(--accent-mid); border-radius: 4px; font-size: 12px; font-family: inherit; background: var(--bg-elevated); color: var(--text-primary); outline: none; width: 100%; min-width: 60px; }
        .data-table .val.pos { color: var(--green); }
        .data-table .val.neg { color: var(--red); }

        .pagination { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 8px 0; font-size: 11px; color: var(--text-muted); }
        .pagination .page-btn { padding: 4px 10px; border: 1px solid var(--border); border-radius: 6px; background: var(--glass-bg); color: var(--text-secondary); cursor: pointer; font-family: inherit; font-size: 11px; transition: all 0.1s; }
        .pagination .page-btn:hover { background: var(--bg-hover); border-color: var(--border-hover); }
        .pagination .page-btn:disabled { opacity: 0.3; pointer-events: none; }

        .totals-row { background: var(--bg-elevated); backdrop-filter: blur(12px); }
        .totals-row td { font-weight: 700; color: var(--text-primary) !important; border-top: 2px solid var(--accent-mid); }

        .col-selector { position: relative; }
        .col-selector .col-toggle { padding: 8px 12px; border: 1px solid var(--border); border-radius: var(--radius-sm); font-size: 12px; font-family: inherit; background: var(--bg-elevated); color: var(--text-secondary); cursor: pointer; }
        .col-selector .col-toggle:hover { background: var(--bg-hover); }
        .col-selector .col-dropdown { position: absolute; top: calc(100% + 4px); right: 0; background: var(--bg-surface); backdrop-filter: blur(24px); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 8px; min-width: 180px; box-shadow: 0 12px 40px rgba(0,0,0,0.5); z-index: 50; display: none; }
        .col-selector .col-dropdown.show { display: block; }
        .col-selector .col-option { display: flex; align-items: center; gap: 6px; padding: 4px 0; font-size: 12px; color: var(--text-secondary); cursor: pointer; }
        .col-selector .col-option:hover { color: var(--text-primary); }
        .col-selector .col-option input[type="checkbox"] { accent-color: var(--accent-mid); cursor: pointer; }

        .chart-wrap { background: var(--bg-elevated); border-radius: var(--radius); padding: 12px; border: 1px solid var(--border); height: 250px; position: relative; }

        .toast-container { position: fixed; top: 60px; left: 50%; transform: translateX(-50%); z-index: 2000; display: flex; flex-direction: column; gap: 6px; pointer-events: none; }
        .toast { background: var(--bg-surface); backdrop-filter: blur(24px); color: var(--text-primary); padding: 10px 20px; border-radius: var(--radius); font-size: 12px; font-weight: 500; animation: slideDown 0.25s ease-out; white-space: nowrap; border: 1px solid var(--border); pointer-events: auto; box-shadow: 0 8px 32px rgba(0,0,0,0.3); }
        .toast.success { background: rgba(34,197,94,0.85); border-color: var(--green); }
        .toast.error { background: rgba(239,68,68,0.85); border-color: var(--red); }
        .toast.warning { background: rgba(245,158,11,0.85); border-color: var(--orange); }
        @keyframes slideDown { from { opacity: 0; transform: translateY(-12px); } to { opacity: 1; transform: translateY(0); } }

        .modal-overlay { position: fixed; inset: 0; z-index: 1500; background: rgba(0,0,0,0.6); display: none; align-items: center; justify-content: center; backdrop-filter: blur(8px); }
        .modal-overlay.open { display: flex; }
        .modal-content { background: var(--bg-surface); backdrop-filter: blur(32px); border: 1px solid var(--border); border-radius: var(--radius-xl); padding: 24px; width: 90%; max-width: 420px; box-shadow: 0 24px 80px rgba(0,0,0,0.5); animation: slideUp 0.25s ease-out; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(24px) scale(0.97); } to { opacity: 1; transform: translateY(0) scale(1); } }
        .modal-title { font-size: 16px; font-weight: 700; margin-bottom: 12px; color: var(--text-primary); }
        .modal-body { margin-bottom: 16px; }
        .modal-body input { padding: 10px 12px; border: 1px solid var(--border); border-radius: var(--radius-sm); font-size: 14px; font-family: inherit; background: var(--bg-elevated); color: var(--text-primary); outline: none; width: 100%; }
        .modal-body input:focus { border-color: var(--accent-mid); box-shadow: 0 0 0 3px rgba(99,102,241,0.15); }
        .modal-actions { display: flex; gap: 8px; justify-content: flex-end; }

        @media (max-width: 768px) {
            .page-content { padding: 8px; }
            .filter-bar { flex-direction: column; align-items: stretch; }
            .search-wrap { max-width: 100%; }
        }
    </style>
</head>
<body>
<header class="app-header">
    <div class="hamburger-wrap"><button class="hamburger-btn" onclick="toggleNav()">☰</button>
    <div class="hamburger-popup" id="hamburgerPopup">
        <button class="ham-item active" onclick="switchTab('sessions')">📊 Sessions</button>
        <button class="ham-item" onclick="switchTab('cards')">🃏 Cards</button>
        <button class="ham-item" onclick="switchTab('orders')">📦 Orders</button>
        <div class="ham-divider"></div>
        <button class="ham-item" onclick="window.location.href='/'">📷 Back to Scanner</button>
    </div></div>
    <span class="brand">MTG Inventory</span>
    <div class="spacer"></div>
    <span id="headerStats" style="font-size:11px;color:var(--text-muted)"></span>
</header>

<div class="page-content">
    <!-- Tabs -->
    <div class="tab-bar">
        <button class="tab-btn active" onclick="switchTab('sessions')">📊 Sessions</button>
        <button class="tab-btn" onclick="switchTab('cards')">🃏 Cards</button>
        <button class="tab-btn" onclick="switchTab('orders')">📦 Orders</button>
    </div>

    <!-- Sessions Tab -->
    <div id="sessionsTab">
        <div class="ui-card">
            <div class="ui-card-title">Session Overview</div>
            <div class="chart-wrap"><canvas id="sessionChart"></canvas></div>
        </div>
        <div class="ui-card">
            <div class="data-table-wrap"><table class="data-table" id="sessionsTable"><thead><tr>
                <th>Session ID</th><th>Set Code</th><th>Set Name</th><th>Date</th><th>Cost</th><th>Value</th><th>Net</th><th>Cards</th>
            </tr></thead><tbody id="sessionsBody"></tbody></table></div>
            <div style="margin-top:8px;font-size:11px;color:var(--text-muted);text-align:center" id="sessionsCount"></div>
        </div>
    </div>

    <!-- Cards Tab -->
    <div id="cardsTab" class="hidden">
        <div class="ui-card" style="padding:12px">
            <div class="filter-bar">
                <div class="search-wrap">
                    <input type="text" id="cardSearch" placeholder="Search cards..." oninput="debounceSearch()" onfocus="this.select()">
                    <button class="clear-btn" onclick="clearSearch()">✕</button>
                </div>
                <label style="display:flex;align-items:center;gap:4px;font-size:11px;color:var(--text-muted);cursor:pointer">
                    <input type="checkbox" id="activeOnlyCheck" checked onchange="loadCards()"> Active only
                </label>
                <input type="text" id="setFilter" placeholder="Set code..." style="width:100px" oninput="loadCards()">
                <div class="col-selector">
                    <button class="col-toggle" onclick="toggleColDropdown()">Columns ▾</button>
                    <div class="col-dropdown" id="colDropdown"></div>
                </div>
                <button class="btn btn-primary btn-sm" onclick="loadCards()" style="margin-left:auto">Refresh</button>
            </div>
        </div>
        <div class="ui-card" style="padding:0">
            <div class="data-table-wrap"><table class="data-table" id="cardsTable"><thead><tr id="cardsTableHead"></tr></thead><tbody id="cardsBody"></tbody></table></div>
            <div class="pagination" id="cardsPagination"></div>
        </div>
        <div style="display:flex;gap:8px;justify-content:flex-end">
            <span id="selectedCount" style="font-size:11px;color:var(--text-muted);align-self:center"></span>
            <button class="btn btn-danger btn-sm" id="sellBtn" onclick="showSellModal()" disabled>Sell Selected</button>
        </div>
    </div>

    <!-- Orders Tab -->
    <div id="ordersTab" class="hidden">
        <div class="ui-card">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
                <span class="ui-card-title" style="margin-bottom:0">Orders</span>
                <button class="btn btn-primary btn-sm" onclick="showNewOrderModal()">+ New Order</button>
            </div>
            <div class="data-table-wrap"><table class="data-table" id="ordersTable"><thead><tr>
                <th>Order ID</th><th>Value</th><th>Date</th><th>Cards</th>
            </tr></thead><tbody id="ordersBody"></tbody></table></div>
        </div>
    </div>
</div>

<!-- Confirm Sales Modal -->
<div class="modal-overlay" id="sellModal">
    <div class="modal-content">
        <div class="modal-title">Confirm Sales</div>
        <div class="modal-body">
            <p style="font-size:13px;color:var(--text-secondary);margin-bottom:8px" id="sellModalInfo"></p>
            <input type="text" id="orderIdInput" placeholder="Enter Order ID..." onkeydown="if(event.key==='Enter')confirmSell()">
        </div>
        <div class="modal-actions">
            <button class="btn btn-ghost" onclick="closeModal('sellModal')">Cancel</button>
            <button class="btn btn-success" onclick="confirmSell()">Confirm</button>
        </div>
    </div>
</div>

<!-- New Order Modal -->
<div class="modal-overlay" id="newOrderModal">
    <div class="modal-content">
        <div class="modal-title">Create New Order</div>
        <div class="modal-body">
            <input type="text" id="newOrderIdInput" placeholder="Order ID..." style="margin-bottom:8px" onkeydown="if(event.key==='Enter')createOrder()">
            <input type="number" id="newOrderValueInput" step="0.01" placeholder="Order value (optional)..." onkeydown="if(event.key==='Enter')createOrder()">
        </div>
        <div class="modal-actions">
            <button class="btn btn-ghost" onclick="closeModal('newOrderModal')">Cancel</button>
            <button class="btn btn-primary" onclick="createOrder()">Create</button>
        </div>
    </div>
</div>

<div class="toast-container" id="toastContainer"></div>

<script>
// ── State ──
let currentTab = 'sessions';
let sessionsData = [];
let cardsData = { cards: [], total: 0, page: 1, total_pages: 1 };
let searchTimeout = null;
let selectedCardIds = new Set();
let sessionChartInstance = null;

const ALL_COLUMNS = [
    { key: 'card_name', label: 'Card Name', default: true },
    { key: 'set_name', label: 'Set Name', default: true },
    { key: 'set_code', label: 'Set Code', default: true },
    { key: 'card_condition', label: 'Condition', default: true },
    { key: 'scryfall_id', label: 'Scryfall ID', default: false },
    { key: 'session_id', label: 'Session ID', default: true },
    { key: 'foil', label: 'Foil', default: true },
    { key: 'borderless', label: 'Borderless', default: true },
    { key: 'price', label: 'Price', default: true },
    { key: 'sold_price', label: 'Sold Price', default: false },
    { key: 'date_sold', label: 'Date Sold', default: false },
    { key: 'order_id', label: 'Order ID', default: false },
    { key: 'created_at', label: 'Created', default: false },
    { key: 'image', label: 'Image', default: true }
];

function getVisibleColumns() {
    try {
        const saved = localStorage.getItem('mtg_inv_columns');
        if (saved) return JSON.parse(saved);
    } catch(e) {}
    return ALL_COLUMNS.filter(c => c.default).map(c => c.key);
}

function setVisibleColumns(keys) {
    localStorage.setItem('mtg_inv_columns', JSON.stringify(keys));
}

// ── Toast ──
function showToast(msg, type) {
    const c = document.getElementById('toastContainer');
    const t = document.createElement('div');
    t.className = 'toast' + (type ? ' ' + type : '');
    t.textContent = msg;
    c.appendChild(t);
    setTimeout(() => { if (t.parentNode) t.parentNode.removeChild(t); }, 2500);
}

// ── Navigation ──
function toggleNav() { document.getElementById('hamburgerPopup').classList.toggle('open'); }

function switchTab(tab) {
    currentTab = tab;
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.textContent.includes({sessions:'📊',cards:'🃏',orders:'📦'}[tab])));
    document.querySelectorAll('.ham-item').forEach(b => b.classList.toggle('active', b.textContent.includes({sessions:'📊',cards:'🃏',orders:'📦'}[tab])));
    ['sessionsTab','cardsTab','ordersTab'].forEach(id => document.getElementById(id).classList.toggle('hidden', id.replace('Tab','') !== tab));
    document.getElementById('hamburgerPopup').classList.remove('open');
    if (tab === 'sessions') loadSessions();
    else if (tab === 'cards') loadCards();
    else if (tab === 'orders') loadOrders();
}

// ── Sessions ──
async function loadSessions() {
    try {
        const resp = await fetch('/api/inventory/sessions');
        const data = await resp.json();
        sessionsData = data.sessions || [];
        
        // Build table
        const tbody = document.getElementById('sessionsBody');
        tbody.innerHTML = sessionsData.map(s => `<tr>
            <td class="editable" onclick="editSessionField('${s.session_id}','session_id',this)">${s.session_id}</td>
            <td class="editable" onclick="editSessionField('${s.session_id}','set_code',this)">${s.set_code || ''}</td>
            <td class="editable" onclick="editSessionField('${s.session_id}','set_name',this)">${s.set_name || ''}</td>
            <td class="editable" onclick="editSessionField('${s.session_id}','date_scanned',this)">${s.date_scanned ? new Date(s.date_scanned).toLocaleDateString() : ''}</td>
            <td class="editable" onclick="editSessionField('${s.session_id}','cost',this)">$${parseFloat(s.cost || 0).toFixed(2)}</td>
            <td>$${parseFloat(s.value || 0).toFixed(2)}</td>
            <td class="${s.net >= 0 ? 'val pos' : 'val neg'}">$${parseFloat(s.net || 0).toFixed(2)}</td>
            <td>${s.card_count || 0}</td>
        </tr>`).join('');

        // Totals row
        if (data.totals) {
            const t = data.totals;
            tbody.innerHTML += `<tr class="totals-row">
                <td colspan="3"><strong>Totals</strong></td>
                <td></td>
                <td><strong>$${t.total_cost.toFixed(2)}</strong></td>
                <td><strong>$${t.total_value.toFixed(2)}</strong></td>
                <td class="${t.total_net >= 0 ? 'val pos' : 'val neg'}"><strong>$${t.total_net.toFixed(2)}</strong></td>
                <td><strong>${t.total_cards}</strong></td>
            </tr>`;
        }

        document.getElementById('sessionsCount').textContent = `${sessionsData.length} sessions, ${data.totals?.total_cards || 0} total cards`;

        // Update header stats
        if (data.totals) {
            document.getElementById('headerStats').textContent = `📊 ${data.totals.total_cards} cards | $${data.totals.total_value.toFixed(2)} | Net: $${data.totals.total_net.toFixed(2)}`;
        }

        // Chart
        renderChart(data.cumulative);
    } catch (e) {
        console.error('Failed to load sessions:', e);
        showToast('Failed to load sessions', 'error');
    }
}

async function editSessionField(sessionId, field, el) {
    const current = el.textContent.replace('$','').trim();
    const input = document.createElement('input');
    input.className = 'edit-input';
    input.value = current;
    input.onblur = async function() {
        const newVal = input.value;
        el.innerHTML = field === 'cost' || field === 'value' || field === 'net' ? '$' + parseFloat(newVal || 0).toFixed(2) : newVal;
        el.onclick = () => editSessionField(sessionId, field, el);
        
        try {
            const body = { [field]: field === 'cost' || field === 'value' || field === 'net' ? parseFloat(newVal) : newVal };
            await fetch(`/api/inventory/sessions/${sessionId}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            });
            showToast('Updated', 'success');
            loadSessions();
        } catch(e) {
            showToast('Update failed', 'error');
        }
    };
    input.onkeydown = (e) => { if (e.key === 'Enter') input.blur(); if (e.key === 'Escape') { el.innerHTML = current; el.onclick = () => editSessionField(sessionId, field, el); } };
    el.innerHTML = '';
    el.appendChild(input);
    input.focus();
    input.select();
}

function renderChart(cumulative) {
    if (!cumulative || cumulative.length === 0) return;
    
    const ctx = document.getElementById('sessionChart').getContext('2d');
    
    if (sessionChartInstance) sessionChartInstance.destroy();
    
    sessionChartInstance = new Chart(ctx, {
        type: 'line',
        data: {
            labels: cumulative.map(s => s.session_id),
            datasets: [
                { label: 'Cumulative Cost', data: cumulative.map(s => s.cost), borderColor: '#ef4444', backgroundColor: 'rgba(239,68,68,0.1)', fill: true, tension: 0.3, pointRadius: 2 },
                { label: 'Cumulative Value', data: cumulative.map(s => s.value), borderColor: '#22c55e', backgroundColor: 'rgba(34,197,94,0.1)', fill: true, tension: 0.3, pointRadius: 2 },
                { label: 'Cumulative Net', data: cumulative.map(s => s.net), borderColor: '#6366f1', backgroundColor: 'rgba(99,102,241,0.1)', fill: true, tension: 0.3, pointRadius: 2 }
            ]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
                legend: { labels: { color: '#9e9eaf', font: { size: 10 }, boxWidth: 12, padding: 8 } }
            },
            scales: {
                x: { ticks: { color: '#6a6a7e', font: { size: 9 }, maxTicksLimit: 20 }, grid: { color: 'rgba(255,255,255,0.03)' } },
                y: { ticks: { color: '#6a6a7e', font: { size: 9 }, callback: v => '$' + v }, grid: { color: 'rgba(255,255,255,0.05)' } }
            }
        }
    });
}

// ── Cards ──
async function loadCards(page) {
    const params = new URLSearchParams();
    const search = document.getElementById('cardSearch').value.trim();
    if (search) params.set('search', search);
    params.set('active', document.getElementById('activeOnlyCheck').checked ? 'true' : 'false');
    const setFilter = document.getElementById('setFilter').value.trim();
    if (setFilter) params.set('set', setFilter);
    params.set('page', page || cardsData.page || 1);
    params.set('limit', 50);

    // Get sort state
    const sortedCol = document.querySelector('#cardsTable th.sorted');
    if (sortedCol) {
        params.set('sort_by', sortedCol.dataset.col);
        params.set('sort_dir', sortedCol.dataset.dir === 'asc' ? 'desc' : 'asc');
    }

    try {
        const resp = await fetch('/api/inventory/cards?' + params.toString());
        cardsData = await resp.json();
        renderCardsTable();
    } catch(e) {
        console.error('Failed to load cards:', e);
        showToast('Failed to load cards', 'error');
    }
}

function renderCardsTable() {
    const visible = getVisibleColumns();
    const showImage = visible.includes('image');
    const dataCols = ALL_COLUMNS.filter(c => c.key !== 'image');

    // Header
    const thead = document.getElementById('cardsTableHead');
    let headerHtml = '';
    if (showImage) headerHtml += '<th>Image</th>';
    headerHtml += dataCols.filter(c => visible.includes(c.key)).map(c => 
        `<th data-col="${c.key}" onclick="sortCards('${c.key}')" class="${c.key === 'card_name' ? 'sorted' : ''}" data-dir="asc">${c.label} <span class="sort-arrow">${c.key === 'card_name' ? '▲' : '▼'}</span></th>`
    ).join('');
    headerHtml += '<th style="width:40px">Select</th>';
    thead.innerHTML = headerHtml;

    // Update column dropdown
    updateColDropdown();

    // Body
    const tbody = document.getElementById('cardsBody');
    if (!cardsData.cards || cardsData.cards.length === 0) {
        tbody.innerHTML = '<tr><td colspan="99" style="text-align:center;padding:24px;color:var(--text-muted)">No cards found</td></tr>';
        document.getElementById('cardsPagination').innerHTML = '';
        updateSelectedCount();
        return;
    }

    tbody.innerHTML = cardsData.cards.map(c => {
        let imgHtml = '';
        if (showImage) {
            const imgUrl = c.card_image?.small || c.card_image?.normal || '';
            imgHtml = `<td>${imgUrl ? `<img class="card-img" src="${imgUrl}" alt="" loading="lazy">` : '<span style="color:var(--text-muted);font-size:10px">—</span>'}</td>`;
        }

        const rowHtml = dataCols.filter(col => visible.includes(col.key)).map(col => {
            let val = c[col.key];
            if (col.key === 'foil' || col.key === 'borderless') val = val ? '✓' : '—';
            else if (col.key === 'price' || col.key === 'sold_price') val = val ? '$' + parseFloat(val).toFixed(2) : '—';
            else if (col.key === 'date_sold') val = val ? new Date(val).toLocaleDateString() : '—';
            else if (col.key === 'created_at') val = val ? new Date(val).toLocaleDateString() : '—';
            return `<td>${val || '—'}</td>`;
        }).join('');

        const checked = selectedCardIds.has(c.id) ? 'checked' : '';
        return `<tr>
            ${imgHtml}${rowHtml}
            <td><input type="checkbox" ${checked} onchange="toggleCardSelect(${c.id}, this.checked)" style="accent-color:var(--accent-mid);cursor:pointer"></td>
        </tr>`;
    }).join('');

    // Pagination
    const pag = document.getElementById('cardsPagination');
    if (cardsData.total_pages <= 1) { pag.innerHTML = ''; return; }
    pag.innerHTML = `
        <button class="page-btn" onclick="loadCards(${cardsData.page - 1})" ${cardsData.page <= 1 ? 'disabled' : ''}>◀ Prev</button>
        <span>Page ${cardsData.page} of ${cardsData.total_pages} (${cardsData.total} total)</span>
        <button class="page-btn" onclick="loadCards(${cardsData.page + 1})" ${cardsData.page >= cardsData.total_pages ? 'disabled' : ''}>Next ▶</button>
    `;
    updateSelectedCount();
}

function toggleCardSelect(id, checked) {
    if (checked) selectedCardIds.add(id);
    else selectedCardIds.delete(id);
    updateSelectedCount();
}

function updateSelectedCount() {
    const count = selectedCardIds.size;
    document.getElementById('selectedCount').textContent = count ? `${count} card(s) selected` : '';
    document.getElementById('sellBtn').disabled = count === 0;
}

function sortCards(col) {
    const th = document.querySelector(`#cardsTable th[data-col="${col}"]`);
    const currentDir = th.dataset.dir || 'asc';
    document.querySelectorAll('#cardsTable th').forEach(el => { el.classList.remove('sorted'); el.dataset.dir = 'asc'; el.querySelector('.sort-arrow').textContent = '▼'; });
    th.classList.add('sorted');
    th.dataset.dir = currentDir;
    th.querySelector('.sort-arrow').textContent = currentDir === 'asc' ? '▲' : '▼';
    loadCards(1);
}

function debounceSearch() {
    clearTimeout(searchTimeout);
    searchTimeout = setTimeout(() => loadCards(1), 300);
}

function clearSearch() {
    document.getElementById('cardSearch').value = '';
    loadCards(1);
}

// ── Column Selector ──
function toggleColDropdown() {
    document.getElementById('colDropdown').classList.toggle('show');
}

function updateColDropdown() {
    const visible = getVisibleColumns();
    const dd = document.getElementById('colDropdown');
    dd.innerHTML = ALL_COLUMNS.map(c => {
        const isVis = visible.includes(c.key);
        return `<label class="col-option">
            <input type="checkbox" ${isVis ? 'checked' : ''} onchange="toggleColumn('${c.key}', this.checked)">
            ${c.label}
        </label>`;
    }).join('');
}

function toggleColumn(key, show) {
    let cols = getVisibleColumns();
    if (show) { if (!cols.includes(key)) cols.push(key); }
    else { cols = cols.filter(c => c !== key); }
    setVisibleColumns(cols);
    renderCardsTable();
}

// Close dropdown on outside click
document.addEventListener('click', function(e) {
    if (!e.target.closest('.col-selector')) {
        document.getElementById('colDropdown').classList.remove('show');
    }
});

// ── Sell / Confirm Sales ──
function showSellModal() {
    if (selectedCardIds.size === 0) { showToast('No cards selected', 'warning'); return; }
    document.getElementById('sellModalInfo').textContent = `Mark ${selectedCardIds.size} card(s) as sold. Enter Order ID:`;
    document.getElementById('orderIdInput').value = '';
    document.getElementById('sellModal').classList.add('open');
    setTimeout(() => document.getElementById('orderIdInput').focus(), 200);
}

async function confirmSell() {
    const orderId = document.getElementById('orderIdInput').value.trim();
    if (!orderId) { showToast('Enter an Order ID', 'warning'); return; }
    
    try {
        const resp = await fetch('/api/inventory/cards/batch-sold', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ card_ids: Array.from(selectedCardIds), order_id: orderId })
        });
        const data = await resp.json();
        if (data.success) {
            showToast(`${data.cards_updated} cards sold for $${data.total_sold.toFixed(2)}`, 'success');
            selectedCardIds.clear();
            closeModal('sellModal');
            loadCards();
            loadOrders();
        } else {
            showToast('Failed: ' + (data.error || 'unknown error'), 'error');
        }
    } catch(e) {
        showToast('Failed to process sale', 'error');
    }
}

// ── Orders ──
async function loadOrders() {
    try {
        const resp = await fetch('/api/inventory/orders');
        const data = await resp.json();
        const orders = data.orders || [];
        
        const tbody = document.getElementById('ordersBody');
        tbody.innerHTML = orders.map(o => `<tr>
            <td>${o.order_id}</td>
            <td>$${parseFloat(o.order_value || 0).toFixed(2)}</td>
            <td>${o.order_date ? new Date(o.order_date).toLocaleDateString() : ''}</td>
            <td>${o.card_count || 0}</td>
        </tr>`).join('');
        
        if (!orders.length) {
            tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;padding:24px;color:var(--text-muted)">No orders yet</td></tr>';
        }
    } catch(e) {
        console.error('Failed to load orders:', e);
        showToast('Failed to load orders', 'error');
    }
}

function showNewOrderModal() {
    document.getElementById('newOrderIdInput').value = 'ORD-' + Date.now().toString(36).toUpperCase();
    document.getElementById('newOrderValueInput').value = '';
    document.getElementById('newOrderModal').classList.add('open');
    setTimeout(() => document.getElementById('newOrderIdInput').focus(), 200);
}

async function createOrder() {
    const orderId = document.getElementById('newOrderIdInput').value.trim();
    if (!orderId) { showToast('Order ID required', 'warning'); return; }
    const orderValue = parseFloat(document.getElementById('newOrderValueInput').value) || 0;
    
    try {
        const resp = await fetch('/api/inventory/orders', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ order_id: orderId, order_value: orderValue })
        });
        const data = await resp.json();
        if (data.success) {
            showToast('Order created', 'success');
            closeModal('newOrderModal');
            loadOrders();
        } else {
            showToast('Failed: ' + (data.error || ''), 'error');
        }
    } catch(e) {
        showToast('Failed to create order', 'error');
    }
}

function closeModal(id) {
    document.getElementById(id).classList.remove('open');
}

// ── Initial load ──
loadSessions();
</script>
</body>
</html>
